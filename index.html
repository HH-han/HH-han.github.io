<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦幻星辰生日蛋糕 (全3D细节版)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030305;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: white;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .birthday-text {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 42px;
            font-weight: 300;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(160, 196, 255, 0.5);
            z-index: 2;
            pointer-events: none;
            letter-spacing: 3px;
            opacity: 0;
            animation: fadeIn 3s 1s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
    <!-- 引入 Three.js 及相关库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="birthday-text">Happy birthday!</div>

    <script>
        // 1. 基础场景设置
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; // 提高曝光度
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 8;
        controls.maxDistance = 30;
        controls.target.set(0, 2.5, 0);

        // 2. 后期处理 (强烈的泛光效果，让星星发光)
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,    // 强度
            0.6,    // 半径
            0.85    // 阈值
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 3. 精细的灯光系统 (还原图二的光影立体感)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // 基础环境光
        scene.add(ambientLight);

        // 顶部聚光灯 (照亮蛋糕顶部和表面星星)
        const spotLight = new THREE.SpotLight(0xffffff, 2);
        spotLight.position.set(0, 12, 2);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.8;
        spotLight.castShadow = true;
        scene.add(spotLight);

        // 蜡烛暖光源
        const candleLight = new THREE.PointLight(0xffaa00, 4, 15);
        candleLight.position.set(0, 4.5, 0);
        scene.add(candleLight);

        // 底部蓝色/白色补光 (照亮底盘和蛋糕下半部)
        const bottomLight = new THREE.PointLight(0x88ccff, 3, 12);
        bottomLight.position.set(0, -2, 0);
        scene.add(bottomLight);
        
        // 侧后方轮廓光 (增加边缘立体感)
        const rimLight = new THREE.DirectionalLight(0xffd700, 1.5);
        rimLight.position.set(-5, 8, -5);
        scene.add(rimLight);

        // 4. 构建发光底盘
        const plateGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.3, 64);
        const plateMat = new THREE.MeshStandardMaterial({ 
            color: 0xe6f1ff, 
            emissive: 0x88ccff, 
            emissiveIntensity: 0.8, // 强自发光
            roughness: 0.2,
            metalness: 0.6
        });
        const plate = new THREE.Mesh(plateGeo, plateMat);
        plate.position.y = 0;
        scene.add(plate);

        // 5. 蛋糕主体 (深色淋面高反光材质)
        const cakeGroup = new THREE.Group();
        cakeGroup.position.y = 1.3; // 放在盘子上
        scene.add(cakeGroup);

        const cakeGeo = new THREE.CylinderGeometry(2.8, 2.8, 2.6, 64);
        const cakeMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x05050a,       // 极深的夜空黑蓝色
            roughness: 0.05,       // 非常光滑
            metalness: 0.2,        // 微微金属感
            clearcoat: 1.0,        // 淋面清漆层，反光神器
            clearcoatRoughness: 0.1,
            reflectivity: 1.0
        });
        const cake = new THREE.Mesh(cakeGeo, cakeMat);
        cakeGroup.add(cake);

        // 顶部糕体稍微大一点的一层微光
        const cakeTopGeo = new THREE.CylinderGeometry(2.82, 2.82, 0.05, 64);
        const cakeTopMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x111122,
            roughness: 0.1,
            clearcoat: 1.0
        });
        const cakeTop = new THREE.Mesh(cakeTopGeo, cakeTopMat);
        cakeTop.position.y = 1.3;
        cakeGroup.add(cakeTop);

        // 6. 动态火焰与蜡烛
        const candleGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.6, 32);
        const candleMat = new THREE.MeshStandardMaterial({ color: 0xffeb99, emissive: 0x552200 });
        const candle = new THREE.Mesh(candleGeo, candleMat);
        candle.position.set(0, 2.1, 0);
        cakeGroup.add(candle);

        // 粒子火焰
        const particleCount = 100;
        const flameGeometry = new THREE.BufferGeometry();
        const flamePositions = new Float32Array(particleCount * 3);
        const particlesData = []; 

        for (let i = 0; i < particleCount; i++) {
            flamePositions[i * 3] = (Math.random() - 0.5) * 0.15;
            flamePositions[i * 3 + 1] = 3 + Math.random() * 0.6; 
            flamePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.15;
            particlesData.push({ velocity: 0.04 + Math.random() * 0.04, angle: Math.random() * Math.PI * 2 });
        }
        flameGeometry.setAttribute('position', new THREE.BufferAttribute(flamePositions, 3));

        function createFlameTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,150,1)');
            gradient.addColorStop(0.6, 'rgba(255,150,0,0.6)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const flameMaterial = new THREE.PointsMaterial({
            size: 0.4,
            map: createFlameTexture(),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
        });
        const flameParticles = new THREE.Points(flameGeometry, flameMaterial);
        cakeGroup.add(flameParticles);

        // 7. 核心：全 3D 几何体星星与彩屑生成
        // 使用 Shape 挤出 3D 星星
        const starShape = new THREE.Shape();
        const outerRadius = 0.2;
        const innerRadius = outerRadius / 2.5;
        for (let i = 0; i < 10; i++) {
            const radius = i % 2 === 0 ? outerRadius : innerRadius;
            const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            if (i === 0) starShape.moveTo(x, y);
            else starShape.lineTo(x, y);
        }
        starShape.closePath();
        const extrudeSettings = { depth: 0.05, bevelEnabled: true, bevelSegments: 1, steps: 1, bevelSize: 0.01, bevelThickness: 0.01 };
        const starGeo = new THREE.ExtrudeGeometry(starShape, extrudeSettings);
        starGeo.center(); // 居中

        // 彩屑使用小长方体
        const flakeGeo = new THREE.BoxGeometry(0.15, 0.02, 0.08);

        // 颜色数组：黄、蓝、粉、绿、白
        const colors = [0xffd700, 0x00bfff, 0xff69b4, 0x32cd32, 0xffffff];

        // 材质：带一点自发光，配合泛光效果
        const decoMat = new THREE.MeshStandardMaterial({
            roughness: 0.2,
            metalness: 0.3,
            emissiveIntensity: 0.4
        });

        // 使用 InstancedMesh 批量渲染 (高性能关键)
        const starCount = 400; // 400个立体星星
        const flakeCount = 400; // 400个立体彩屑
        
        const starMesh = new THREE.InstancedMesh(starGeo, decoMat, starCount);
        const flakeMesh = new THREE.InstancedMesh(flakeGeo, decoMat, flakeCount);

        const dummy = new THREE.Object3D(); // 用于计算位置和旋转的辅助对象
        const colorObj = new THREE.Color();

        // --- 部署蛋糕表面的星星 (侧面) ---
        for (let i = 0; i < 200; i++) {
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 2.6; // 蛋糕高度内
            const radius = 2.82; // 紧贴表面

            dummy.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
            // 让星星朝外
            dummy.lookAt(dummy.position.x * 2, y, dummy.position.z * 2);
            // 随机平面旋转一点
            dummy.rotateZ(Math.random() * Math.PI);
            dummy.updateMatrix();

            starMesh.setMatrixAt(i, dummy.matrix);
            colorObj.setHex(colors[Math.floor(Math.random() * colors.length)]);
            starMesh.setColorAt(i, colorObj);
        }
        
        // --- 部署蛋糕表面的星星 (顶部) ---
        for (let i = 200; i < starCount; i++) {
            const r = Math.random() * 2.7; // 半径内
            const angle = Math.random() * Math.PI * 2;
            
            dummy.position.set(Math.cos(angle) * r, 1.32, Math.sin(angle) * r);
            dummy.rotation.set(-Math.PI / 2, 0, Math.random() * Math.PI); // 平躺在顶部
            dummy.updateMatrix();

            starMesh.setMatrixAt(i, dummy.matrix);
            colorObj.setHex(colors[Math.floor(Math.random() * colors.length)]);
            starMesh.setColorAt(i, colorObj);
        }

        // --- 部署彩屑 (散布在侧面和顶部) ---
        for (let i = 0; i < flakeCount; i++) {
            const isTop = Math.random() > 0.5;
            if (isTop) {
                // 顶部
                const r = Math.random() * 2.7;
                const angle = Math.random() * Math.PI * 2;
                dummy.position.set(Math.cos(angle) * r, 1.32, Math.sin(angle) * r);
                dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            } else {
                // 侧面
                const angle = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 2.6;
                const radius = 2.82;
                dummy.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
                dummy.lookAt(dummy.position.x * 2, y, dummy.position.z * 2);
                dummy.rotateZ(Math.random() * Math.PI);
            }
            dummy.updateMatrix();

            flakeMesh.setMatrixAt(i, dummy.matrix);
            colorObj.setHex(colors[Math.floor(Math.random() * colors.length)]);
            flakeMesh.setColorAt(i, colorObj);
        }

        // 更新实例化网格的颜色和矩阵
        starMesh.instanceMatrix.needsUpdate = true;
        if(starMesh.instanceColor) starMesh.instanceColor.needsUpdate = true;
        flakeMesh.instanceMatrix.needsUpdate = true;
        if(flakeMesh.instanceColor) flakeMesh.instanceColor.needsUpdate = true;

        // 将表面装饰添加到蛋糕组
        cakeGroup.add(starMesh);
        cakeGroup.add(flakeMesh);

        // 8. 悬浮在半空中的立体星星与彩屑 (重构，使用独立 Mesh 以便做动画)
        const floatingStars = [];
        for(let i=0; i<60; i++) {
            const size = 0.2 + Math.random() * 0.4; // 大小不一
            const geo = starGeo.clone();
            geo.scale(size, size, size);
            
            const mat = new THREE.MeshStandardMaterial({
                color: colors[Math.floor(Math.random() * colors.length)],
                emissive: colors[Math.floor(Math.random() * colors.length)],
                emissiveIntensity: 0.5,
                roughness: 0.2
            });
            const mesh = new THREE.Mesh(geo, mat);

            // 随机分布在一个球壳区域
            const radius = 3.5 + Math.random() * 5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            mesh.position.set(
                radius * Math.sin(phi) * Math.cos(theta),
                2.5 + radius * Math.cos(phi), // 重心偏上
                radius * Math.sin(phi) * Math.sin(theta)
            );

            // 动画参数
            mesh.userData = {
                rotSpeed: (Math.random() - 0.5) * 0.05,
                floatSpeed: 0.5 + Math.random() * 1.5,
                floatOffset: Math.random() * Math.PI * 2,
                originalY: mesh.position.y
            };
            
            scene.add(mesh);
            floatingStars.push(mesh);
        }

        // 9. 背景星尘 (Points)
        const dustCount = 1500;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        const dustColors = new Float32Array(dustCount * 3);

        for(let i=0; i<dustCount; i++) {
            const r = 2 + Math.random() * 10;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            dustPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
            dustPositions[i*3+1] = 2.5 + r * Math.cos(phi); 
            dustPositions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

            const c = new THREE.Color(colors[Math.floor(Math.random() * colors.length)]);
            dustColors[i*3] = c.r; dustColors[i*3+1] = c.g; dustColors[i*3+2] = c.b;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));

        const dustMat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const dustParticles = new THREE.Points(dustGeo, dustMat);
        scene.add(dustParticles);

        // 10. 背景金色交叉光环
        const ringGroup = new THREE.Group();
        scene.add(ringGroup);
        const ringGeo = new THREE.TorusGeometry(7.5, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.4 });
        
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI / 2.2;
        ring1.position.y = 2.5;
        ringGroup.add(ring1);

        const ring2 = new THREE.Mesh(ringGeo, ringMat);
        ring2.rotation.x = Math.PI / 2.2;
        ring2.rotation.y = Math.PI / 3;
        ring2.position.y = 2.5;
        ringGroup.add(ring2);

        // 11. 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 光环旋转
            ringGroup.rotation.y += 0.001;
            ringGroup.rotation.z = Math.sin(time * 0.3) * 0.1;

            // 悬浮星星旋转与浮动
            floatingStars.forEach(star => {
                star.rotation.x += star.userData.rotSpeed;
                star.rotation.y += star.userData.rotSpeed;
                star.position.y = star.userData.originalY + Math.sin(time * star.userData.floatSpeed + star.userData.floatOffset) * 0.4;
            });

            // 背景星尘缓慢旋转
            dustParticles.rotation.y += 0.0005;

            // 火焰粒子
            const positions = flameGeometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const pData = particlesData[i];
                positions[i * 3 + 1] += pData.velocity;
                positions[i * 3] += Math.sin(time * 12 + pData.angle) * 0.006;
                positions[i * 3 + 2] += Math.cos(time * 10 + pData.angle) * 0.006;

                if (positions[i * 3 + 1] > 4.2) {
                    positions[i * 3] = (Math.random() - 0.5) * 0.1;
                    positions[i * 3 + 1] = 3.0;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
                }
            }
            flameGeometry.attributes.position.needsUpdate = true;

            // 烛光闪烁
            candleLight.intensity = 3.5 + Math.sin(time * 20) * 1.2;

            controls.update();
            composer.render(); // 使用泛光通道渲染
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
