<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星河生日蛋糕 (高级细节版)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #03050a;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: white;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* 左侧文字 UI */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }
        .text-top-left {
            margin-top: 15vh;
            margin-left: 5vw;
            max-width: 320px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }
        .text-top-left p {
            font-size: 10px;
            letter-spacing: 2px;
            color: #8892b0;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .text-top-left h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: #e6f1ff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(230,241,255,0.5);
        }
        .text-top-left h2 {
            font-size: 18px;
            font-weight: 400;
            margin: 0 0 20px 0;
            color: #ccd6f6;
            line-height: 1.5;
        }
        .text-top-left .sub-text {
            font-size: 12px;
            color: #8892b0;
            letter-spacing: 1px;
        }
        .bottom-bar {
            text-align: center;
            font-size: 12px;
            color: #8892b0;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 3s 1s forwards;
        }
        .bottom-bar span {
            margin: 0 15px;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
    <!-- 引入 Three.js 核心库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- 引入后期处理库 (用于发光效果) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="text-top-left">
            <p>A LITTLE UNIVERSE JUST FOR YOU</p>
            <h1>把星河，送给你。</h1>
            <p style="text-transform: none; letter-spacing: 1px;">愿你的每一次许愿，都有星光回应。</p>
            <br>
            <p>生日快乐</p>
            <p class="sub-text">跳动烛火 · 生日许愿 · 星河光环</p>
        </div>
        
        <div class="bottom-bar">
            <span>II 暂停</span>
            <span>音乐</span>
            <span>纯属欣赏</span>
            <span>保存图片</span>
            <span>退出动画</span>
        </div>
    </div>

    <script>
        // 1. 基础场景设置
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03050a, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // 电影级色彩映射
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 8;
        controls.maxDistance = 30;
        controls.target.set(0, 2.5, 0);

        // 2. 后期处理 (泛光 Bloom 效果)
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,    // 强度 (Strength)
            0.4,    // 半径 (Radius)
            0.85    // 阈值 (Threshold) - 只有亮度高于此值的对象才会发光
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 3. 光照系统
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const candleLight = new THREE.PointLight(0xffaa00, 3, 20); // 蜡烛光源
        candleLight.position.set(0, 5, 0);
        scene.add(candleLight);

        const fillLight = new THREE.DirectionalLight(0x4a90e2, 1.5); // 蓝色补光
        fillLight.position.set(-5, 5, 5);
        scene.add(fillLight);

        const bottomLight = new THREE.PointLight(0x3a506b, 2, 10); // 底部底盘光晕
        bottomLight.position.set(0, -1, 0);
        scene.add(bottomLight);

        // 4. 生成高级星空纹理 (带星云和随机亮星)
        function createHighQualityStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 深邃宇宙背景
            ctx.fillStyle = '#050914';
            ctx.fillRect(0, 0, 1024, 1024);

            // 绘制星云 (径向渐变)
            const colors = ['#1c2541', '#2a3b6b', '#0b132b'];
            for(let i=0; i<10; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 400 + 200;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                const c = colors[Math.floor(Math.random()*colors.length)];
                grad.addColorStop(0, c);
                grad.addColorStop(1, 'rgba(5,9,20,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // 绘制星星 (大小不一，部分带有发光)
            for (let i = 0; i < 3000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const radius = Math.random() * 1.5;
                const alpha = Math.random();
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                
                if (Math.random() > 0.9) {
                    // 10% 的星星带有彩色光晕
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = Math.random() > 0.5 ? '#a0c4ff' : '#ffd6a5';
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                } else {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                }
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const starTexture = createHighQualityStarTexture();

        // 5. 构建高细节蛋糕模型
        const cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        // 底盘 (发光玻璃质感)
        const plateGeo = new THREE.CylinderGeometry(3.8, 3.8, 0.2, 64);
        const plateMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xa0c4ff, 
            transparent: true, 
            opacity: 0.3,
            transmission: 0.9, // 透光率
            roughness: 0.1,
            metalness: 0.8,
            emissive: 0x2a3b6b,
            emissiveIntensity: 0.5
        });
        const plate = new THREE.Mesh(plateGeo, plateMat);
        plate.position.y = 0;
        cakeGroup.add(plate);

        // 底盘高光环
        const plateRingGeo = new THREE.TorusGeometry(3.8, 0.05, 16, 100);
        const plateRingMat = new THREE.MeshBasicMaterial({ color: 0xa0c4ff, transparent: true, opacity: 0.8 });
        const plateRing = new THREE.Mesh(plateRingGeo, plateRingMat);
        plateRing.rotation.x = Math.PI / 2;
        plateRing.position.y = 0.1;
        cakeGroup.add(plateRing);

        // 蛋糕主体材质 (果冻/发光质感)
        const cakeMat = new THREE.MeshPhysicalMaterial({ 
            map: starTexture,
            bumpMap: starTexture, // 用星空图做一点凹凸感
            bumpScale: 0.05,
            roughness: 0.15,
            metalness: 0.2,
            clearcoat: 1.0, // 清漆涂层
            clearcoatRoughness: 0.1,
            emissive: new THREE.Color(0x1a2a6c),
            emissiveIntensity: 0.8,
            transparent: true,
            opacity: 0.95
        });

        // 蛋糕底层
        const cakeBaseGeo = new THREE.CylinderGeometry(3, 3, 2.2, 64);
        const cakeBase = new THREE.Mesh(cakeBaseGeo, cakeMat);
        cakeBase.position.y = 1.2;
        cakeGroup.add(cakeBase);

        // 蛋糕顶层 (略小)
        const cakeTopGeo = new THREE.CylinderGeometry(2.4, 2.4, 1.8, 64);
        const cakeTop = new THREE.Mesh(cakeTopGeo, cakeMat);
        cakeTop.position.y = 3.2;
        cakeGroup.add(cakeTop);

        // 蛋糕层间发光环 (糖霜效果)
        const creamRingGeo = new THREE.TorusGeometry(3, 0.1, 16, 64);
        const creamRingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x5a7cff, emissiveIntensity: 1 });
        const creamRing = new THREE.Mesh(creamRingGeo, creamRingMat);
        creamRing.rotation.x = Math.PI / 2;
        creamRing.position.y = 2.3;
        cakeGroup.add(creamRing);

        // 6. 蜡烛与高级粒子火焰
        const candleGroup = new THREE.Group();
        candleGroup.position.set(0, 4.1, 0);
        cakeGroup.add(candleGroup);

        // 蜡烛主体
        const candleGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 32);
        const candleMat = new THREE.MeshStandardMaterial({ 
            color: 0xe6f1ff, 
            roughness: 0.2,
            emissive: 0x2a3b6b,
            emissiveIntensity: 0.5,
            transparent: true,
            opacity: 0.9
        });
        const candle = new THREE.Mesh(candleGeo, candleMat);
        candle.position.y = 0.75;
        candleGroup.add(candle);

        // 蜡烛芯
        const wickGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8);
        const wickMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const wick = new THREE.Mesh(wickGeo, wickMat);
        wick.position.y = 1.6;
        candleGroup.add(wick);

        // 动态粒子火焰
        const particleCount = 100;
        const flameGeometry = new THREE.BufferGeometry();
        const flamePositions = new Float32Array(particleCount * 3);
        const flameColors = new Float32Array(particleCount * 3);
        const particlesData = []; // 存储每个粒子的独立数据

        // 初始化粒子数据
        for (let i = 0; i < particleCount; i++) {
            // 初始位置分布在烛芯上方
            flamePositions[i * 3] = (Math.random() - 0.5) * 0.2;
            flamePositions[i * 3 + 1] = 1.7 + Math.random() * 0.2;
            flamePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
            
            // 颜色：亮黄 -> 橙 -> 暗红
            const color = new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 1.0, 0.6);
            flameColors[i * 3] = color.r;
            flameColors[i * 3 + 1] = color.g;
            flameColors[i * 3 + 2] = color.b;

            particlesData.push({
                velocity: 0.02 + Math.random() * 0.03,
                angle: Math.random() * Math.PI * 2,
                radius: Math.random() * 0.05,
                life: Math.random(), // 生命周期
                speed: 0.01 + Math.random() * 0.02
            });
        }

        flameGeometry.setAttribute('position', new THREE.BufferAttribute(flamePositions, 3));
        flameGeometry.setAttribute('color', new THREE.BufferAttribute(flameColors, 3));

        // 火焰材质贴图 (径向渐变发光)
        function createFlameTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,220,100,1)');
            gradient.addColorStop(0.5, 'rgba(255,120,0,0.6)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const flameMaterial = new THREE.PointsMaterial({
            size: 0.35,
            map: createFlameTexture(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.9
        });

        const flameParticles = new THREE.Points(flameGeometry, flameMaterial);
        candleGroup.add(flameParticles);

        // 7. 星河光环与星轨
        const ringGroup = new THREE.Group();
        ringGroup.position.y = 2.5;
        ringGroup.rotation.x = Math.PI / 3;
        ringGroup.rotation.z = Math.PI / 8;
        cakeGroup.add(ringGroup);

        // 光环实线
        const ringGeo = new THREE.TorusGeometry(4.5, 0.01, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ringGroup.add(ring);

        // 光环渐变虚线 (用粒子模拟)
        const orbitParticleCount = 800;
        const orbitGeo = new THREE.BufferGeometry();
        const orbitPositions = new Float32Array(orbitParticleCount * 3);
        const orbitColors = new Float32Array(orbitParticleCount * 3);
        
        for(let i=0; i<orbitParticleCount; i++) {
            // 让粒子在光环附近散开
            const angle = Math.random() * Math.PI * 2;
            const radius = 4.5 + (Math.random() - 0.5) * 0.5; 
            const yOffset = (Math.random() - 0.5) * 0.3;
            
            orbitPositions[i*3] = Math.cos(angle) * radius;
            orbitPositions[i*3+1] = yOffset;
            orbitPositions[i*3+2] = Math.sin(angle) * radius;

            // 颜色：白蓝渐变
            const color = new THREE.Color().setHSL(0.6, 0.8, 0.7 + Math.random()*0.3);
            orbitColors[i*3] = color.r;
            orbitColors[i*3+1] = color.g;
            orbitColors[i*3+2] = color.b;
        }
        
        orbitGeo.setAttribute('position', new THREE.BufferAttribute(orbitPositions, 3));
        orbitGeo.setAttribute('color', new THREE.BufferAttribute(orbitColors, 3));
        
        const orbitMat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const orbitParticles = new THREE.Points(orbitGeo, orbitMat);
        ringGroup.add(orbitParticles);

        // 8. 背景星空
        const bgStarsGeo = new THREE.BufferGeometry();
        const bgStarsCount = 3000;
        const bgStarsPos = new Float32Array(bgStarsCount * 3);
        for(let i=0; i<bgStarsCount; i++) {
            bgStarsPos[i*3] = (Math.random() - 0.5) * 150;
            bgStarsPos[i*3+1] = (Math.random() - 0.5) * 150;
            bgStarsPos[i*3+2] = (Math.random() - 0.5) * 150;
        }
        bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgStarsPos, 3));
        const bgStarsMat = new THREE.PointsMaterial({ 
            color: 0x8892b0, 
            size: 0.15, 
            transparent: true, 
            opacity: 0.6,
            blending: THREE.AdditiveBlending 
        });
        const bgStars = new THREE.Points(bgStarsGeo, bgStarsMat);
        scene.add(bgStars);

        // 9. 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 旋转光环
            ringGroup.rotation.y += 0.003;
            
            // 背景星空缓慢移动
            bgStars.rotation.y += 0.0005;
            bgStars.rotation.x += 0.0002;

            // 粒子火焰逻辑 (更真实的上升与消失)
            const positions = flameGeometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const pData = particlesData[i];
                
                // 粒子向上移动
                positions[i * 3 + 1] += pData.velocity;
                
                // 左右摆动 (风的效果)
                positions[i * 3] += Math.sin(time * 8 + pData.angle) * 0.008;
                positions[i * 3 + 2] += Math.cos(time * 6 + pData.angle) * 0.008;

                // 如果粒子飞得太高，重置回底部
                if (positions[i * 3 + 1] > 2.5) {
                    positions[i * 3] = (Math.random() - 0.5) * 0.1;
                    positions[i * 3 + 1] = 1.7;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
                }
            }
            flameGeometry.attributes.position.needsUpdate = true;

            // 蜡烛光源随火焰跳动而闪烁
            candleLight.intensity = 2.5 + Math.sin(time * 15) * 0.8 + Math.sin(time * 30) * 0.3;
            candleLight.position.x = Math.sin(time * 10) * 0.05; // 光源轻微晃动

            controls.update();
            
            // 使用带有泛光效果的 composer 渲染，而不是普通的 renderer
            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
