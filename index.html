<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星河生日蛋糕</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: white;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 左侧文字 UI */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让鼠标事件穿透到 3D 场景 */
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        .text-top-left {
            margin-top: 20vh;
            margin-left: 5vw;
            max-width: 300px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        .text-top-left p {
            font-size: 10px;
            letter-spacing: 2px;
            color: #8892b0;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .text-top-left h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: #e6f1ff;
            letter-spacing: 1px;
        }

        .text-top-left h2 {
            font-size: 18px;
            font-weight: 400;
            margin: 0 0 20px 0;
            color: #ccd6f6;
            line-height: 1.4;
        }

        .text-top-left .sub-text {
            font-size: 12px;
            color: #8892b0;
            letter-spacing: 1px;
        }

        /* 底部装饰条 */
        .bottom-bar {
            text-align: center;
            font-size: 12px;
            color: #8892b0;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 3s 1s forwards;
        }

        .bottom-bar span {
            margin: 0 10px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* 播放按钮样式 */
        .play-btn-container {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 3;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
    <!-- 引入 Three.js 和 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 文字 UI 覆盖层 -->
    <div class="ui-overlay">
        <div class="text-top-left">
            <p>A LITTLE UNIVERSE JUST FOR YOU</p>
            <h1>把星河，送给你。</h1>
            <p style="text-transform: none; letter-spacing: 1px;">愿你的每一次许愿，都有星光回应。</p>
            <br>
            <p>我和 Codex 的一次复刻尝试</p>
            <h2>让 Codex 复刻<br>网红生日蛋糕网页</h2>
            <p class="sub-text">跳动烛火 · 生日许愿 · 星河光环</p>
        </div>
        
        <div class="bottom-bar">
            <span>II 暂停</span>
            <span>音乐</span>
            <span>纯属欣赏</span>
            <span>保存图片</span>
            <span>退出动画</span>
        </div>
    </div>

    <div class="play-btn-container">
        <div class="play-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            全屏观看
        </div>
    </div>

    <script>
        // 1. 基础场景设置
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 添加一点雾效，让背景更有深邃感
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 控制器 (允许用户旋转查看)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // 限制不能看到地底下
        controls.minDistance = 5;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // 2. 光照系统
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // 环境光
        scene.add(ambientLight);

        const candleLight = new THREE.PointLight(0xffaa00, 2, 15); // 蜡烛光源
        candleLight.position.set(0, 4.5, 0);
        scene.add(candleLight);

        const fillLight = new THREE.DirectionalLight(0x4a90e2, 1); // 补光
        fillLight.position.set(-5, 5, 5);
        scene.add(fillLight);

        // 3. 生成星空纹理 (程序化生成 Canvas 纹理)
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 基础深蓝色渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, 512);
            gradient.addColorStop(0, '#0b132b');
            gradient.addColorStop(0.5, '#1c2541');
            gradient.addColorStop(1, '#3a506b');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);

            // 画星星
            for (let i = 0; i < 2000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const radius = Math.random() * 1.5;
                const alpha = Math.random();
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        const starTexture = createStarTexture();

        // 4. 构建蛋糕模型
        const cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        // 蛋糕底盘 (白色发光)
        const plateGeo = new THREE.CylinderGeometry(3.5, 3.5, 0.1, 64);
        const plateMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 0.8,
            emissive: 0xffffff,
            emissiveIntensity: 0.2
        });
        const plate = new THREE.Mesh(plateGeo, plateMat);
        plate.position.y = 0;
        cakeGroup.add(plate);

        // 蛋糕底层
        const cakeBaseGeo = new THREE.CylinderGeometry(2.8, 2.8, 2, 64);
        const cakeMat = new THREE.MeshStandardMaterial({ 
            map: starTexture,
            roughness: 0.2,
            metalness: 0.8,
            emissive: new THREE.Color(0x1a2a6c),
            emissiveIntensity: 0.5
        });
        const cakeBase = new THREE.Mesh(cakeBaseGeo, cakeMat);
        cakeBase.position.y = 1.05;
        cakeGroup.add(cakeBase);

        // 蛋糕顶层
        const cakeTopGeo = new THREE.CylinderGeometry(2.2, 2.2, 1.5, 64);
        const cakeTop = new THREE.Mesh(cakeTopGeo, cakeMat);
        cakeTop.position.y = 2.8;
        cakeGroup.add(cakeTop);

        // 5. 蜡烛与动态粒子火焰
        const candleGroup = new THREE.Group();
        candleGroup.position.set(0, 3.55, 0);
        cakeGroup.add(candleGroup);

        // 蜡烛主体
        const candleGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.2, 32);
        const candleMat = new THREE.MeshStandardMaterial({ 
            color: 0xd4e5ff, 
            emissive: 0x3a506b,
            transparent: true,
            opacity: 0.9
        });
        const candle = new THREE.Mesh(candleGeo, candleMat);
        candle.position.y = 0.6;
        candleGroup.add(candle);

        // 蜡烛芯
        const wickGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8);
        const wickMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const wick = new THREE.Mesh(wickGeo, wickMat);
        wick.position.y = 1.3;
        candleGroup.add(wick);

        // 动态粒子火焰系统 (使用 Points)
        const particleCount = 60;
        const flameGeometry = new THREE.BufferGeometry();
        const flamePositions = new Float32Array(particleCount * 3);
        const flameColors = new Float32Array(particleCount * 3);
        
        // 初始化火焰粒子数据
        const particleSpeeds = [];
        for (let i = 0; i < particleCount; i++) {
            // 初始位置分布在烛芯上方
            flamePositions[i * 3] = (Math.random() - 0.5) * 0.15;
            flamePositions[i * 3 + 1] = 1.4 + Math.random() * 0.5;
            flamePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.15;
            
            // 颜色：从黄色到橙色渐变
            const color = new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 1.0, 0.5 + Math.random() * 0.3);
            flameColors[i * 3] = color.r;
            flameColors[i * 3 + 1] = color.g;
            flameColors[i * 3 + 2] = color.b;

            particleSpeeds.push({
                y: 0.02 + Math.random() * 0.04,
                x: (Math.random() - 0.5) * 0.01,
                z: (Math.random() - 0.5) * 0.01
            });
        }

        flameGeometry.setAttribute('position', new THREE.BufferAttribute(flamePositions, 3));
        flameGeometry.setAttribute('color', new THREE.BufferAttribute(flameColors, 3));

        // 使用 Canvas 生成圆形发光粒子贴图
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,200,0,1)');
            gradient.addColorStop(0.5, 'rgba(255,100,0,0.5)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const flameMaterial = new THREE.PointsMaterial({
            size: 0.3,
            map: createGlowTexture(),
            vertexColors: true,
            blending: THREE.AdditiveBlending, // 叠加混合，产生发光效果
            depthWrite: false,
            transparent: true,
            opacity: 0.9
        });

        const flameParticles = new THREE.Points(flameGeometry, flameMaterial);
        candleGroup.add(flameParticles);

        // 6. 星河光环与环绕粒子
        const ringGroup = new THREE.Group();
        ringGroup.position.y = 2;
        ringGroup.rotation.x = Math.PI / 4; // 倾斜
        ringGroup.rotation.z = Math.PI / 6;
        cakeGroup.add(ringGroup);

        // 光环 (细线)
        const ringGeo = new THREE.TorusGeometry(4, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xa0c4ff, transparent: true, opacity: 0.3 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ringGroup.add(ring);

        // 环绕的星尘粒子
        const orbitParticleCount = 500;
        const orbitGeo = new THREE.BufferGeometry();
        const orbitPositions = new Float32Array(orbitParticleCount * 3);
        
        for(let i=0; i<orbitParticleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3.5 + Math.random() * 1.5; // 环形分布
            const yOffset = (Math.random() - 0.5) * 0.5;
            
            orbitPositions[i*3] = Math.cos(angle) * radius;
            orbitPositions[i*3+1] = yOffset;
            orbitPositions[i*3+2] = Math.sin(angle) * radius;
        }
        
        orbitGeo.setAttribute('position', new THREE.BufferAttribute(orbitPositions, 3));
        const orbitMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const orbitParticles = new THREE.Points(orbitGeo, orbitMat);
        ringGroup.add(orbitParticles);

        // 7. 全局背景星空
        const bgStarsGeo = new THREE.BufferGeometry();
        const bgStarsCount = 2000;
        const bgStarsPos = new Float32Array(bgStarsCount * 3);
        for(let i=0; i<bgStarsCount; i++) {
            bgStarsPos[i*3] = (Math.random() - 0.5) * 100;
            bgStarsPos[i*3+1] = (Math.random() - 0.5) * 100;
            bgStarsPos[i*3+2] = (Math.random() - 0.5) * 100;
        }
        bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgStarsPos, 3));
        const bgStarsMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.1 });
        const bgStars = new THREE.Points(bgStarsGeo, bgStarsMat);
        scene.add(bgStars);

        // 8. 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 旋转光环和星尘
            ringGroup.rotation.y += 0.002;
            
            // 背景星空缓慢旋转
            bgStars.rotation.y += 0.0002;
            bgStars.rotation.x += 0.0001;

            // 动态粒子火焰效果逻辑
            const positions = flameGeometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                // 粒子向上移动
                positions[i * 3 + 1] += particleSpeeds[i].y;
                
                // 粒子左右摆动 (正弦波模拟火焰跳动)
                positions[i * 3] += Math.sin(time * 5 + i) * 0.005 + particleSpeeds[i].x;
                positions[i * 3 + 2] += Math.cos(time * 3 + i) * 0.005 + particleSpeeds[i].z;

                // 如果粒子飞得太高，重置回底部
                if (positions[i * 3 + 1] > 2.2) {
                    positions[i * 3] = (Math.random() - 0.5) * 0.1;
                    positions[i * 3 + 1] = 1.4;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
                }
            }
            flameGeometry.attributes.position.needsUpdate = true; // 通知 Three.js 更新位置数据

            // 蜡烛光源随火焰跳动而闪烁
            candleLight.intensity = 1.5 + Math.sin(time * 10) * 0.5;

            // 更新控制器
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // 窗口大小适配
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
