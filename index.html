<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>林澈 · 个人博客</title>
  <script>
    (function(){
      var s = localStorage.getItem('theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var t = s || (d ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #fff;
      --surface-soft: #eef2f8;
      --text: # 012172a;
      --muted: #5a6478;
      --accent: # 0077ff;
      --accent-soft: rgba(0, 119, 255, 0.12);
      --border: #dce3ee;
      --glow: 0 0 18px rgba(0, 119, 255, 0.18);
      --shadow: 0 8px 30px rgba(18, 23, 42, 0.08);
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: # 0a0a12;
      --surface: # 012121f;
      --surface-soft: # 01a1a2e;
      --text: #e8e8f0;
      --muted: # 08a8aa3;
      --accent: # 022d3ee;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --border: # 026263d;
      --glow: 0 0 22px rgba(34, 211, 238, 0.28);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.25s, color 0.25s;
    }
    button {
      font: inherit;
      cursor: pointer;
      background: none;
      border: none;
      color: inherit;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .brand {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.04em;
    }
    .brand span {
      color: var(--accent);
    }
    nav {
      display: flex;
      gap: 18px;
      align-items: center;
    }
    nav a {
      font-size: 14px;
      color: var(--muted);
      transition: color 0.2s;
    }
    nav a:hover {
      color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 17px;
      color: var(--muted);
      transition: 0.2s;
    }
    .icon-btn:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }
    [data-theme="light"] .icon-moon {
      display: none;
    }
    [data-theme="dark"] .icon-sun {
      display: none;
    }
    .hero {
      padding: 72px 0 56px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(var(--border) 1px, transparent 1px),
                        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      mask-image: linear-gradient(180deg, # 000, transparent 85%);
    }
    .hero h1 {
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.15;
      position: relative;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent), 0 0 30px var(--accent-soft);
    }
    .hero .role {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
      margin-top: 16px;
      letter-spacing: 0.06em;
    }
    .hero p {
      max-width: 560px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
    }
    .socials {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    .socials a {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--muted);
      transition: 0.2s;
    }
    .socials a:hover {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: var(--glow);
    }
    section {
      padding: 48px 0;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      transition: 0.25s;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: var(--glow), var(--shadow);
      transform: translateY(-2px);
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .tag {
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .post-grid {
      display: grid;
      gap: 14px;
    }
    .post-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .post-title {
      font-size: 16px;
      font-weight: 700;
      transition: color 0.2s;
    }
    .card:hover .post-title {
      color: var(--accent);
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0;
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }
    @media (max-width: 560px) {
      nav a {
        display: none;
      }
      .hero {
        padding: 52px 0 40px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <div class="brand">林澈<span>.</span></div>
      <nav>
        <a href="#about" data-i18n="nav.about">关于</a>
        <a href="#timeline" data-i18n="nav.timeline">历程</a>
        <a href="#posts" data-i18n="nav.posts">文章</a>
      </nav>
      <div class="actions">
        <button class="icon-btn" id="langToggle" aria-label="切换语言">
          <i class="ri-global-line"></i>
        </button>
        <button class="icon-btn" id="themeToggle" aria-label="切换主题">
          <i class="ri-sun-line icon-sun"></i>
          <i class="ri-moon-line icon-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>
        <em data-i18n="hero.name">林澈</em><br />
        <span data-i18n="hero.role">前端工程师 / 开源爱好者</span>
      </h1>
      <p data-i18n="hero.desc">关注 Web 性能、开发者体验与可视化。</p>
      <div class="socials">
        <a href="#" aria-label="GitHub"><i class="ri-github-line"></i></a>
        <a href="#" aria-label="Email"><i class="ri-mail-line"></i></a>
        <a href="#" aria-label="RSS"><i class="ri-rss-line"></i></a>
      </div>
    </section>

    <section id="about">
      <div class="section-label">01 / About</div>
      <h2 data-i18n="about.title">关于我</h2>
      <div class="card">
        <p data-i18n="about.body">我是一名专注于前端工程与体验的开发者，喜欢把复杂问题拆解成简单的界面。</p>
        <div class="tags">
          <span class="tag">TypeScript</span>
          <span class="tag">CSS</span>
          <span class="tag">性能优化</span>
          <span class="tag">可视化</span>
        </div>
      </div>
    </section>

    <section id="posts">
      <div class="section-label">02 / Writing</div>
      <h2 data-i18n="posts.title">最近文章</h2>
      <div class="post-grid">
        <article class="card">
          <div class="post-meta" data-i18n="post.1.meta">2026-10 · 工程化</div>
          <div class="post-title" data-i18n="post.1.title">CSS 容器查询的落地实践</div>
        </article>
        <article class="card">
          <div class="post-meta" data-i18n="post.2.meta">2026-09 · 性能</div>
          <div class="post-title" data-i18n="post.2.title">首屏无闪烁主题切换的完整方案</div>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">© 2026 林澈 · Built with vanilla HTML/CSS/JS</div>
  </footer>

  <script>
    /* ---------- I18N ---------- */
    const I18N = {
      Zh: {
        'nav.about': '关于',
        'nav.timeline': '历程',
        'nav.posts': '文章',
        'hero.name': '林澈',
        'hero.role': '前端工程师 / 开源爱好者',
        'hero.desc': '关注 Web 性能、开发者体验与可视化。',
        'about.title': '关于我',
        'about.body': '我是一名专注于前端工程与体验的开发者，喜欢把复杂问题拆解成简单的界面。',
        'posts.title': '最近文章',
        'post.1.meta': '2026-10 · 工程化',
        'post.1.title': 'CSS 容器查询的落地实践',
        'post.2.meta': '2026-09 · 性能',
        'post.2.title': '首屏无闪烁主题切换的完整方案',
        'lang.label': 'EN'
      },
      En: {
        'nav.about': 'About',
        'nav.timeline': 'Timeline',
        'nav.posts': 'Posts',
        'hero.name': 'Lin Che',
        'hero.role': 'Frontend Engineer / OSS Enthusiast',
        'hero.desc': 'Web performance, developer experience, and visualization.',
        'about.title': 'About',
        'about.body': 'I build interfaces with a focus on frontend engineering and experience.',
        'posts.title': 'Recent Posts',
        'post.1.meta': 'Oct 2026 · Engineering',
        'post.1.title': 'Container Queries in Production',
        'post.2.meta': 'Sep 2026 · Performance',
        'post.2.title': 'A No-Flash Theme Toggle, End to End',
        'lang.label': '中'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'Zh';

    function applyLanguage(lang) {
      const dict = I18N[lang] || I18N.Zh;
      document.documentElement.lang = lang === 'Zh' ? 'zh-CN' : 'en';
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (dict[key] !== undefined) el.textContent = dict[key];
      });

      const langBtn = document.getElementById('langToggle');
      if (langBtn) {
        const label = dict['lang.label'];
        langBtn.setAttribute('aria-label', lang === 'Zh' ? 'Switch to English' : '切换到中文');
        langBtn.innerHTML = `<i class="ri-global-line"></i>`;
        langBtn.appendChild(document.createTextNode(` ${label}`));
        langBtn.style.width = 'auto';
        langBtn.style.padding = '0 10px';
        langBtn.style.fontSize = '12px';
        langBtn.style.fontFamily = 'var(--mono)';
      }

      localStorage.setItem('lang', lang);
      currentLang = lang;
    }

    /* ---------- THEME ---------- */
    function syncThemeButton(theme) {
      const btn = document.getElementById('themeToggle');
      if (btn) {
        btn.setAttribute('aria-label', theme === 'dark' ? '切换到亮色' : '切换到暗色');
      }
    }

    function setTheme(theme, persist) {
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      if (persist !== false) localStorage.setItem('theme', theme);
      syncThemeButton(theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'dark' ? 'light' : 'dark');
    }

    /* ---------- INIT ---------- */
    document.addEventListener('DOMContentLoaded', function () {
      applyLanguage(currentLang);
      const theme = document.documentElement.getAttribute('data-theme') || 'light';
      syncThemeButton(theme);

      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      document.getElementById('langToggle').addEventListener('click', function () {
        applyLanguage(currentLang === 'Zh' ? 'En' : 'Zh');
      });
    });
  </script>
</body>
</html>
